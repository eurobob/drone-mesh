<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Drone Mesh Explorer</title>
  <style>
    /* ============ instrument tokens ============ */
    :root {
      --surface: #FFFFFF;
      --surface-dim: #F1F2EE;
      --ink: #191C19;
      --ink-soft: #6A6F67;
      --line: #E1E3DD;
      --confirm: #1F7A33;
      --danger: #C0392B;
      --radius: 16px;
      --radius-s: 10px;
      --shadow: 0 10px 36px rgba(18, 22, 16, 0.22);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }

    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--font);
      position: fixed;
      inset: 0;
      width: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      touch-action: none;
    }
    button { font-family: var(--font); }
    button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    button:disabled { opacity: 0.35; cursor: default; }

    /* ============ dev instrumentation stays dark ============ */
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 10px;
      border-radius: 5px;
      font-size: 13px;
    }
    #loading-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    #loading-overlay.active { display: flex; }
    .loader {
      border: 5px solid #f3f3f3;
      border-top: 5px solid #3498db;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-text { color: white; margin-top: 20px; font-size: 18px; }
    #loading-progress { color: #3498db; margin-top: 10px; font-size: 14px; }
    #progressive-loader {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 16px;
      border-radius: 20px;
      display: none;
      align-items: center;
      gap: 10px;
      z-index: 900;
    }
    #progressive-loader.active { display: flex; }
    .pulse-dot {
      width: 8px; height: 8px;
      background: #3498db;
      border-radius: 50%;
      animation: pulse 1.5s ease-in-out infinite;
    }
    .pulse-dot:nth-child(2) { animation-delay: 0.2s; }
    .pulse-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    /* ============ product surfaces: white instrument ============ */
    .sheet {
      display: none;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(12px + env(safe-area-inset-bottom));
      width: min(96vw, 600px);
      background: var(--surface);
      color: var(--ink);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 12px 16px calc(14px);
      box-sizing: border-box;
    }
    .sheet.active { display: block; }

    .sheet-utility {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-soft);
      min-height: 32px;
    }
    .lp-spacer { flex: 1; }
    .icon-quiet {
      width: 34px; height: 34px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink-soft);
      border-radius: 50%;
      font-size: 14px;
      cursor: pointer;
      flex: none;
    }
    .icon-quiet.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 30%, var(--line)); }

    /* the signature: the class IS the control */
    .class-hero {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-bottom: 3px solid var(--cls, var(--line));
      border-radius: var(--radius-s);
      padding: 12px 16px;
      margin: 8px 0 10px;
      font-size: 22px;
      font-weight: 700;
      color: var(--ink);
      cursor: pointer;
      text-align: left;
    }
    .hero-dot {
      width: 16px; height: 16px;
      border-radius: 50%;
      background: var(--cls, var(--line));
      flex: none;
    }
    .hero-chev {
      margin-left: auto;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }

    .option-grid {
      display: none;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 8px;
      padding-bottom: 10px;
    }
    .option-grid.active { display: grid; }
    .class-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-s);
      padding: 11px 12px;
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
    }
    .class-btn::before {
      content: "";
      width: 11px; height: 11px;
      border-radius: 50%;
      background: var(--chip, var(--line));
      flex: none;
    }
    .class-btn.active {
      border-color: var(--ink);
      box-shadow: inset 0 0 0 1px var(--ink);
    }

    .tool-row {
      display: flex;
      gap: 8px;
      padding: 2px 0 10px;
    }
    .tool-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-s);
      padding: 7px 4px 6px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ink-soft);
      cursor: pointer;
    }
    .tool-btn > span {
      font-size: 19px;
      line-height: 1.1;
      color: var(--ink);
      text-transform: none;
    }
    .tool-btn.active {
      background: var(--ink);
      border-color: var(--ink);
      color: rgba(255, 255, 255, 0.75);
    }
    .tool-btn.active > span { color: #fff; }

    .action-row {
      display: flex;
      gap: 8px;
      align-items: center;
      border-top: 1px solid var(--line);
      padding-top: 12px;
    }
    .btn-quiet {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-s);
      padding: 13px 16px;
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
    }
    .btn-primary {
      background: var(--confirm);
      border: 1px solid var(--confirm);
      border-radius: var(--radius-s);
      padding: 13px 22px;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      min-width: 42%;
    }

    /* confidence pills (explore panel) */
    .conf-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
    }
    .conf-btn::before {
      content: "";
      width: 9px; height: 9px;
      border-radius: 50%;
      background: var(--chip, var(--line));
    }
    .conf-btn.active { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
    .conf-row { display: flex; gap: 6px; align-items: center; }

    .sheet-summary {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-soft);
      padding: 2px 0 8px;
    }

    /* labels card (top right) */
    #labels-card {
      display: none;
      position: absolute;
      top: 10px;
      right: 10px;
      width: min(84vw, 280px);
      background: var(--surface);
      color: var(--ink);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      font-size: 13px;
      padding: 10px 12px;
      box-sizing: border-box;
    }
    #labels-card.active { display: block; }
    .lc-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
      font-weight: 700;
    }
    .lc-head .ghost-btn {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
    }
    #labels-count { color: var(--ink-soft); font-weight: 600; }
    #labels-list { max-height: 34vh; overflow-y: auto; }
    .label-row {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 0;
      border-top: 1px solid var(--line);
      font-size: 13px;
    }
    .label-name { flex: 1; font-weight: 600; }
    .label-meta { color: var(--ink-soft); font-size: 12px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
    .row-del {
      background: none;
      border: none;
      color: var(--ink-soft);
      font-size: 15px;
      cursor: pointer;
      padding: 0 4px;
    }
    .row-del:hover { color: var(--danger); }
    .auto-chip {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--ink-soft);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 0 4px;
      vertical-align: 1px;
    }

    @media (prefers-reduced-motion: no-preference) {
      .option-grid.active { animation: reveal 0.15s ease-out; }
      @keyframes reveal {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: none; }
      }
    }

    @media (max-width: 640px) {
      #info { font-size: 10px; padding: 6px 8px; max-width: 44vw; opacity: 0.85; }
      #labels-card { width: auto; max-width: 58vw; font-size: 12px; }
      .class-hero { font-size: 18px; padding: 10px 12px; }
      .btn-primary { padding: 12px 14px; }
      .btn-quiet { padding: 12px 10px; font-size: 13px; }
      #labels-list { max-height: 26vh; }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="info">
    <strong>Controls:</strong><br>
    WASD - Move<br>
    Shift - Fast mode<br>
    Click + Drag - Look around
  </div>
  <div id="loading-overlay">
    <div class="loader"></div>
    <div id="loading-text">Loading mesh...</div>
    <div id="loading-progress"></div>
  </div>
  <div id="progressive-loader">
    <div class="pulse-dot"></div>
    <div class="pulse-dot"></div>
    <div class="pulse-dot"></div>
    <span style="color: white; font-size: 12px; margin-left: 5px;">Enhancing quality...</span>
  </div>

  <!-- explore: create a label -->
  <div id="label-panel" class="sheet">
    <div id="lp-summary" class="sheet-summary"></div>
    <div id="lp-classes" class="option-grid active"></div>
    <div class="tool-row">
      <button id="lp-add" class="tool-btn" title="Merge more surfaces (Shift+Click)"><span>+</span>Add</button>
      <button id="lp-sub" class="tool-btn" title="Remove a region (Alt+Click)"><span>−</span>Remove</button>
      <button id="lp-undo" class="tool-btn" title="Undo last change (Z)"><span>↩</span>Undo</button>
      <button id="lp-grow" class="tool-btn" title="Expand by one ring"><span>⊕</span>Grow</button>
      <button id="lp-shrink" class="tool-btn" title="Contract by one ring"><span>⊖</span>Shrink</button>
    </div>
    <div class="action-row">
      <div id="lp-conf" class="conf-row"></div>
      <span class="lp-spacer"></span>
      <button id="lp-delete" class="icon-quiet danger" style="display:none" title="Delete this label">🗑</button>
      <button id="lp-cancel" class="btn-quiet">Cancel</button>
      <button id="lp-save" class="btn-primary">Save label</button>
    </div>
  </div>

  <!-- labels inventory -->
  <div id="labels-card">
    <div class="lc-head">
      <strong>Labels</strong>
      <span id="labels-count">0</span>
      <span class="lp-spacer"></span>
      <button id="labels-auto" class="ghost-btn" title="Segment and classify the whole map as review proposals">✨ Auto-tag</button>
      <button id="labels-review" class="ghost-btn">▶ Review</button>
      <button id="labels-export" class="ghost-btn">Export</button>
      <button id="labels-clear" class="ghost-btn">Clear</button>
    </div>
    <div id="labels-list"></div>
  </div>

  <!-- review: one sheet, everything in reach -->
  <div id="review-actions" class="sheet">
    <div class="sheet-utility">
      <span id="rh-progress"></span>
      <span id="rh-meta"></span>
      <span class="lp-spacer"></span>
      <button id="ra-delete" class="icon-quiet danger" style="display:none" title="Delete this label">🗑</button>
      <button id="rh-exit" class="icon-quiet" title="Exit review">✕</button>
    </div>
    <button id="ra-class" class="class-hero" title="Change what this surface is">
      <span class="hero-dot" id="ra-class-dot"></span>
      <span id="rh-class"></span>
      <span class="hero-chev">change</span>
    </button>
    <div id="ra-reclass" class="option-grid"></div>
    <div class="tool-row" id="ra-tools">
      <button id="ra-add" class="tool-btn" title="Tap surfaces to add"><span>+</span>Add</button>
      <button id="ra-sub" class="tool-btn" title="Tap regions to remove"><span>−</span>Remove</button>
      <button id="ra-undo" class="tool-btn" title="Undo last change (Z)"><span>↩</span>Undo</button>
      <button id="ra-grow" class="tool-btn" title="Expand by one ring"><span>⊕</span>Grow</button>
      <button id="ra-shrink" class="tool-btn" title="Contract by one ring"><span>⊖</span>Shrink</button>
    </div>
    <div class="action-row" id="ra-verbs">
      <button id="ra-flag" class="btn-quiet">⚑ Flag</button>
      <button id="ra-skip" class="btn-quiet">Skip →</button>
      <button id="ra-discard" class="btn-quiet" style="display:none">Discard</button>
      <span class="lp-spacer"></span>
      <button id="ra-correct" class="btn-primary">✓ Confirm</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
