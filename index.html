<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Drone Mesh Explorer</title>
  <style>
    /* ============ instrument tokens ============ */
    :root {
      --surface: #FFFFFF;
      --surface-dim: #F1F2EE;
      --ink: #191C19;
      --ink-soft: #6A6F67;
      --line: #E1E3DD;
      --confirm: #1F7A33;
      --danger: #C0392B;
      --radius: 16px;
      --radius-s: 10px;
      --shadow: 0 10px 36px rgba(18, 22, 16, 0.22);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }

    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--font);
      position: fixed;
      inset: 0;
      width: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      /* it's an instrument, not a document — no text selection, no long-press
         callout, no blue tap flash on the controls */
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      touch-action: none;
    }
    button { font-family: var(--font); }
    button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    button:disabled { opacity: 0.35; cursor: default; }

    /* ============ dev instrumentation stays dark ============ */
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 10px;
      border-radius: 5px;
      font-size: 13px;
    }
    #loading-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    #loading-overlay.active { display: flex; }
    .loader {
      border: 5px solid #f3f3f3;
      border-top: 5px solid #3498db;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-text { color: white; margin-top: 20px; font-size: 18px; }
    #loading-progress { color: #3498db; margin-top: 10px; font-size: 14px; }
    #progressive-loader {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 16px;
      border-radius: 20px;
      display: none;
      align-items: center;
      gap: 10px;
      z-index: 900;
    }
    #progressive-loader.active { display: flex; }
    .pulse-dot {
      width: 8px; height: 8px;
      background: #3498db;
      border-radius: 50%;
      animation: pulse 1.5s ease-in-out infinite;
    }
    .pulse-dot:nth-child(2) { animation-delay: 0.2s; }
    .pulse-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    /* ============ product surfaces: white instrument ============ */
    .sheet {
      display: none;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      /* sits above the primary tool bar */
      bottom: calc(84px + env(safe-area-inset-bottom));
      width: min(96vw, 600px);
      background: var(--surface);
      color: var(--ink);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 12px 16px calc(14px);
      box-sizing: border-box;
    }
    .sheet.active { display: block; }

    .sheet-utility {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-soft);
      min-height: 32px;
    }
    .lp-spacer { flex: 1; }
    .icon-quiet {
      width: 34px; height: 34px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink-soft);
      border-radius: 50%;
      font-size: 14px;
      cursor: pointer;
      flex: none;
    }
    .icon-quiet.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 30%, var(--line)); }

    /* the signature: the class IS the control */
    .class-hero {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-bottom: 3px solid var(--cls, var(--line));
      border-radius: var(--radius-s);
      padding: 12px 16px;
      margin: 8px 0 10px;
      font-size: 22px;
      font-weight: 700;
      color: var(--ink);
      cursor: pointer;
      text-align: left;
    }
    .hero-dot {
      width: 16px; height: 16px;
      border-radius: 50%;
      background: var(--cls, var(--line));
      flex: none;
    }
    .hero-chev {
      margin-left: auto;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }

    .option-grid {
      display: none;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 8px;
      padding-bottom: 10px;
    }
    .option-grid.active { display: grid; }
    .class-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-s);
      padding: 11px 12px;
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
    }
    .class-btn::before {
      content: "";
      width: 11px; height: 11px;
      border-radius: 50%;
      background: var(--chip, var(--line));
      flex: none;
    }
    .class-btn.active {
      border-color: var(--ink);
      box-shadow: inset 0 0 0 1px var(--ink);
    }

    .tool-row {
      display: flex;
      gap: 8px;
      padding: 2px 0 10px;
    }
    .tool-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-s);
      padding: 7px 4px 6px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ink-soft);
      cursor: pointer;
    }
    .tool-btn > span {
      font-size: 19px;
      line-height: 1.1;
      color: var(--ink);
      text-transform: none;
    }
    .tool-btn.active {
      background: var(--ink);
      border-color: var(--ink);
      color: rgba(255, 255, 255, 0.75);
    }
    .tool-btn.active > span { color: #fff; }

    .action-row {
      display: flex;
      gap: 8px;
      align-items: center;
      border-top: 1px solid var(--line);
      padding-top: 12px;
    }
    .btn-quiet {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-s);
      padding: 13px 16px;
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
    }
    .btn-primary {
      background: var(--confirm);
      border: 1px solid var(--confirm);
      border-radius: var(--radius-s);
      padding: 13px 22px;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      min-width: 42%;
    }

    /* confidence pills (explore panel) */
    .conf-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
    }
    .conf-btn::before {
      content: "";
      width: 9px; height: 9px;
      border-radius: 50%;
      background: var(--chip, var(--line));
    }
    .conf-btn.active { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
    .conf-row { display: flex; gap: 6px; align-items: center; }

    .sheet-summary {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-soft);
      padding: 2px 0 8px;
    }

    /* generic round button (info, ⋯) */
    .round-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      font-size: 17px;
      font-weight: 700;
      font-style: italic;
      cursor: pointer;
      box-shadow: var(--shadow);
      flex: none;
    }

    /* controls help as a popover from the (i) button */
    #info {
      display: none;
      position: absolute;
      top: calc(60px + env(safe-area-inset-top));
      left: 12px;
      max-width: 260px;
      background: var(--surface);
      color: var(--ink);
      border-radius: var(--radius-s);
      box-shadow: var(--shadow);
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.5;
      z-index: 860;
    }
    #info.active { display: block; }

    /* top-left cluster */
    #corner-tl {
      position: absolute;
      top: calc(12px + env(safe-area-inset-top));
      left: 12px;
      z-index: 850;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-start;
    }
    #focus-group {
      display: none;
      flex-direction: column;
      gap: 4px;
      background: var(--surface);
      border-radius: var(--radius-s);
      box-shadow: var(--shadow);
      padding: 6px;
    }
    #focus-group.visible { display: flex; }
    .fg-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-soft);
      padding: 2px 2px 0;
    }
    .focus-btn {
      width: 52px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 4px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
    }
    .focus-btn:active { background: var(--surface-dim); }

    /* top-center mode toggle */
    #mode-toggle {
      position: absolute;
      top: calc(12px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      background: var(--surface);
      border-radius: 999px;
      box-shadow: var(--shadow);
      padding: 4px;
      z-index: 850;
    }
    .mode-btn {
      border: none;
      background: transparent;
      border-radius: 999px;
      padding: 8px 20px;
      font-size: 14px;
      font-weight: 700;
      color: var(--ink-soft);
      cursor: pointer;
    }
    .mode-btn.active { background: var(--ink); color: #fff; }
    .mode-btn:disabled { opacity: 0.4; cursor: default; }

    /* primary tool bar */
    #toolbar {
      display: none;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(14px + env(safe-area-inset-bottom));
      background: var(--surface);
      border-radius: 999px;
      box-shadow: var(--shadow);
      padding: 6px;
      gap: 2px;
      align-items: center;
      z-index: 840;
      max-width: 96vw;
    }
    #toolbar.visible { display: flex; }
    .tool-ico {
      width: 52px;
      min-height: 50px;
      border: none;
      background: transparent;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-size: 10px;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
    }
    .tool-ico svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .tool-ico.active { background: var(--ink); color: #fff; }
    .tool-ico:disabled { opacity: 0.35; }
    #tb-intent.intent-add { color: var(--confirm); }
    #tb-intent.intent-remove { color: var(--danger); }
    .tool-div {
      width: 1px;
      align-self: stretch;
      background: var(--line);
      margin: 6px 3px;
    }
    .refine-only { display: none; }
    #toolbar.editing .refine-only { display: flex; }
    #toolbar.editing .tool-div.refine-only { display: block; }

    /* labels menu (tucked utilities) */
    #labels-menu { display: none; flex-direction: column; gap: 2px; margin-top: 8px; }
    #labels-menu.open { display: flex; }
    #labels-menu button {
      text-align: left;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
    }
    #labels-menu button.danger-text { color: var(--danger); }

    /* labels card (top right) */
    #labels-card {
      display: none;
      position: absolute;
      top: 10px;
      right: 10px;
      width: min(84vw, 280px);
      background: var(--surface);
      color: var(--ink);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      font-size: 13px;
      padding: 10px 12px;
      box-sizing: border-box;
    }
    #labels-card.active { display: block; }
    .lc-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
      font-weight: 700;
    }
    .lc-head .ghost-btn {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
    }
    #labels-count { color: var(--ink-soft); font-weight: 600; }
    .coverage { font-size: 11px; color: var(--confirm); font-weight: 700; }
    .view-row {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      align-items: center;
      padding: 2px 0 8px;
    }
    .view-btn {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-soft);
      cursor: pointer;
      white-space: nowrap;
    }
    .view-btn.active { background: var(--ink); border-color: var(--ink); color: #fff; }
    .class-dot-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid var(--line);
      cursor: pointer;
      padding: 0;
      flex: none;
    }
    .class-dot-btn.active { border-color: var(--ink); transform: scale(1.15); }
    #labels-list { max-height: 34vh; overflow-y: auto; }
    .label-row {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 0;
      border-top: 1px solid var(--line);
      font-size: 13px;
    }
    .label-name { flex: 1; font-weight: 600; }
    .label-meta { color: var(--ink-soft); font-size: 12px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
    .row-del {
      background: none;
      border: none;
      color: var(--ink-soft);
      font-size: 15px;
      cursor: pointer;
      padding: 0 4px;
    }
    .row-del:hover { color: var(--danger); }
    .auto-chip {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--ink-soft);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 0 4px;
      vertical-align: 1px;
    }

    @media (prefers-reduced-motion: no-preference) {
      .option-grid.active { animation: reveal 0.15s ease-out; }
      @keyframes reveal {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: none; }
      }
    }

    @media (max-width: 640px) {
      #info { font-size: 10px; padding: 6px 8px; max-width: 44vw; opacity: 0.85; }
      #labels-card { width: auto; max-width: 58vw; font-size: 12px; }
      .class-hero { font-size: 18px; padding: 10px 12px; }
      .btn-primary { padding: 12px 14px; }
      .btn-quiet { padding: 12px 10px; font-size: 13px; }
      #labels-list { max-height: 26vh; }
      /* Dock is a top-right gooey FAB on every size; on phones the labels
         card sits top-right too, so give the dock a bit of top offset to
         clear it and keep the FAB thumb-sized. */
      #toolbar { padding: 4px; gap: 0; }
      .tool-ico { width: 44px; min-height: 46px; }
      #labels-card { max-width: 46vw; }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <!-- controls help, revealed by the (i) button -->
  <div id="info" class="popover">
    <strong>Controls</strong><br>
    Drag — look around · WASD — move · Shift — faster<br>
    Pick a tool below to tag. <b>Move</b> = camera only.
  </div>

  <!-- top-left: info + focus-view -->
  <div id="corner-tl">
    <button id="btn-info" class="round-btn" title="Controls">i</button>
    <div id="focus-group" title="Frame the selection">
      <span class="fg-label">Focus</span>
      <button class="focus-btn" data-view3d="top">Top</button>
      <button class="focus-btn" data-view3d="front">Front</button>
      <button class="focus-btn" data-view3d="side">Side</button>
      <button class="focus-btn" data-view3d="reset">¾</button>
    </div>
  </div>

  <!-- top-center: mode -->
  <div id="mode-toggle">
    <button id="mode-explore" class="mode-btn active">Explore</button>
    <button id="mode-review" class="mode-btn">Review</button>
  </div>

  <div id="loading-overlay">
    <div class="loader"></div>
    <div id="loading-text">Loading mesh...</div>
    <div id="loading-progress"></div>
  </div>
  <div id="progressive-loader">
    <div class="pulse-dot"></div>
    <div class="pulse-dot"></div>
    <div class="pulse-dot"></div>
    <span style="color: white; font-size: 12px; margin-left: 5px;">Enhancing quality...</span>
  </div>

  <!-- explore: create a label -->
  <div id="label-panel" class="sheet">
    <div id="lp-summary" class="sheet-summary"></div>
    <div id="lp-classes" class="option-grid active"></div>
    <div class="action-row">
      <div id="lp-conf" class="conf-row"></div>
      <span class="lp-spacer"></span>
      <button id="lp-delete" class="icon-quiet danger" style="display:none" title="Delete this label">🗑</button>
      <button id="lp-cancel" class="btn-quiet">Cancel</button>
      <button id="lp-save" class="btn-primary">Save label</button>
    </div>
  </div>

  <!-- top-right: map status + view filters + tucked utilities -->
  <div id="labels-card">
    <div class="lc-head">
      <strong id="labels-count">0</strong>
      <span id="labels-coverage" class="coverage"></span>
      <span class="lp-spacer"></span>
      <button id="labels-menu-btn" class="round-btn" title="More">⋯</button>
    </div>
    <div class="view-row" id="view-modes">
      <button class="view-btn active" data-view="all">All</button>
      <button class="view-btn" data-view="untagged" title="Dim labeled areas so remaining work stands out">Untagged</button>
      <button class="view-btn" data-view="confirmed" title="Confirmed only">✓</button>
      <button class="view-btn" data-view="proposals" title="Proposals only">⚑</button>
    </div>
    <div class="view-row" id="view-classes"></div>
    <div id="labels-menu" class="menu">
      <button id="labels-export">⬇ Export JSON</button>
      <button id="labels-auto">✨ Auto-tag map</button>
      <button id="labels-clear" class="danger-text">Clear all labels</button>
    </div>
  </div>

  <!-- primary tool bar: shared by explore + review editing -->
  <div id="toolbar">
    <button class="tool-ico active" data-tool="navigate" title="Move the camera (no tagging)">
      <svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18"/><path d="M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/></svg>Move</button>
    <button class="tool-ico" data-tool="tap" title="Tap a surface to select">
      <svg viewBox="0 0 24 24"><path d="M7 4l11 7-4.5 1 2.5 6-2 1-2.5-6L8 17z"/></svg>Tap</button>
    <button class="tool-ico" data-tool="brush" title="Brush faces">
      <svg viewBox="0 0 24 24"><path d="M14 4l6 6-7 7-4 1 1-4z"/><path d="M5 20c1.5 0 2.5-1 2.5-2.5"/></svg>Brush</button>
    <button class="tool-ico" data-tool="lasso" title="Lasso faces">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="10" r="6" stroke-dasharray="3 3"/><path d="M8 15c-1.5 1.5-.5 4 1.5 4"/></svg>Lasso</button>
    <span class="tool-div"></span>
    <button id="tb-intent" class="tool-ico intent-add" title="Toggle add / remove">
      <svg viewBox="0 0 24 24" id="tb-intent-svg"><path d="M12 5v14M5 12h14"/></svg><span id="tb-intent-lbl">Add</span></button>
    <span class="tool-div refine-only"></span>
    <button id="tb-undo" class="tool-ico refine-only" title="Undo (Z)">
      <svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5"/><path d="M4 12h11a4 4 0 0 1 0 8h-1"/></svg>Undo</button>
    <button id="tb-grow" class="tool-ico refine-only" title="Grow one ring">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Grow</button>
    <button id="tb-shrink" class="tool-ico refine-only" title="Shrink one ring">
      <svg viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>Shrink</button>
  </div>

  <!-- explore: commit a label -->
  <div id="review-actions" class="sheet">
    <div class="sheet-utility">
      <span id="rh-progress"></span>
      <span id="rh-meta"></span>
      <span class="lp-spacer"></span>
      <button id="ra-delete" class="icon-quiet danger" style="display:none" title="Delete this label">🗑</button>
      <button id="rh-exit" class="icon-quiet" title="Exit review">✕</button>
    </div>
    <button id="ra-class" class="class-hero" title="Change what this surface is">
      <span class="hero-dot" id="ra-class-dot"></span>
      <span id="rh-class"></span>
      <span class="hero-chev">change</span>
    </button>
    <div id="ra-reclass" class="option-grid"></div>
    <div class="action-row" id="ra-verbs">
      <button id="ra-flag" class="btn-quiet">⚑ Flag</button>
      <button id="ra-skip" class="btn-quiet">Skip →</button>
      <button id="ra-discard" class="btn-quiet" style="display:none">Discard</button>
      <span class="lp-spacer"></span>
      <button id="ra-correct" class="btn-primary">✓ Confirm</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
