<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drone Mesh Explorer</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 10px;
      border-radius: 5px;
      font-size: 14px;
    }
    #loading-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    #loading-overlay.active {
      display: flex;
    }
    .loader {
      border: 5px solid #f3f3f3;
      border-top: 5px solid #3498db;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    #loading-text {
      color: white;
      margin-top: 20px;
      font-size: 18px;
    }
    #loading-progress {
      color: #3498db;
      margin-top: 10px;
      font-size: 14px;
    }
    #progressive-loader {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 16px;
      border-radius: 20px;
      display: none;
      align-items: center;
      gap: 10px;
    }
    #progressive-loader.active {
      display: flex;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      background: #3498db;
      border-radius: 50%;
      animation: pulse 1.5s ease-in-out infinite;
    }
    .pulse-dot:nth-child(2) { animation-delay: 0.2s; }
    .pulse-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="info">
    <strong>Controls:</strong><br>
    WASD - Move<br>
    Shift - Fast mode<br>
    Click + Drag - Look around
  </div>
  <div id="loading-overlay">
    <div class="loader"></div>
    <div id="loading-text">Loading mesh...</div>
    <div id="loading-progress"></div>
  </div>
  <div id="progressive-loader">
    <div class="pulse-dot"></div>
    <div class="pulse-dot"></div>
    <div class="pulse-dot"></div>
    <span style="color: white; font-size: 12px; margin-left: 5px;">Enhancing quality...</span>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
